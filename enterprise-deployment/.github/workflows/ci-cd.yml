# CI/CD Pipeline for ESPER Enterprise

name: ESPER Enterprise CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: esper-enterprise
  FRONTEND_IMAGE: ${REGISTRY}/${{ github.repository }}/frontend:${{ github.sha }}
  API_GATEWAY_IMAGE: ${REGISTRY}/${{ github.repository }}/api-gateway:${{ github.sha }}
  PROD_FRONTEND_IMAGE: ${REGISTRY}/${{ github.repository }}/frontend:prod
  PROD_API_GATEWAY_IMAGE: ${REGISTRY}/${{ github.repository }}/api-gateway:prod

jobs:
  # Security Scanning
  security-scan:
    name: Security Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run npm audit
      run: npm audit --audit-level moderate

    - name: Run Snyk security scan
      uses: snyk/actions/node@master
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      with:
        args: --severity-threshold=high

    - name: Run CodeQL Analysis
      uses: github/codeql-action/init@v2
      with:
        languages: ${{ matrix.language }}
        add-mono: true

  # Frontend Build and Test
  frontend-build:
    name: Frontend Build and Test
    runs-on: ubuntu-latest
    needs: security-scan
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run linting
      run: npm run lint

    - name: Run type checking
      run: npm run type-check

    - name: Run unit tests
      run: npm run test:unit
      env:
        CI: true

    - name: Run integration tests
      run: npm run test:integration
      env:
        CI: true

    - name: Build frontend
      run: npm run build

    - name: Build Docker image
      run: |
        docker build -f enterprise-deployment/Dockerfile.frontend \
          -t ${FRONTEND_IMAGE} \
          --build-arg NODE_ENV=production \
          .

    - name: Run security scan on Docker image
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${FRONTEND_IMAGE}
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy scan results
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: 'trivy-results.sarif'

    - name: Push Docker image
      run: |
        echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
        docker push ${FRONTEND_IMAGE}

  # Backend Build and Test
  backend-build:
    name: Backend Build and Test
    runs-on: ubuntu-latest
    needs: security-scan
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: cd backend && npm ci

    - name: Run linting
      run: cd backend && npm run lint

    - name: Run type checking
      run: cd backend && npm run type-check

    - name: Run unit tests
      run: cd backend && npm run test:unit
      env:
        CI: true

    - name: Run integration tests
      run: cd backend && npm run test:integration
      env:
        CI: true

    - name: Run e2e tests
      run: cd backend && npm run test:e2e
      env:
        CI: true

    - name: Build backend
      run: cd backend && npm run build

    - name: Build Docker image
      run: |
        docker build -f enterprise-deployment/Dockerfile.gateway \
          -t ${API_GATEWAY_IMAGE} \
          --build-arg NODE_ENV=production \
          .

    - name: Run security scan on Docker image
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${API_GATEWAY_IMAGE}
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Push Docker image
      run: |
        echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
        docker push ${API_GATEWAY_IMAGE}

  # Performance Testing
  performance-test:
    name: Performance Testing
    runs-on: ubuntu-latest
    needs: [frontend-build, backend-build]
    if: github.ref == 'refs/heads/main'
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install k6
      uses: grafana/k6-action-setup@v1

    - name: Run load testing
      run: |
        k6 run --out json=results.json scripts/load-testing/load-test.js

    - name: Upload performance results
      uses: actions/upload-artifact@v3
      with:
        name: performance-results
        path: results.json

  # Infrastructure as Code Validation
  infrastructure-validation:
    name: Infrastructure Validation
    runs-on: ubuntu-latest
    needs: [frontend-build, backend-build]
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v2

    - name: Terraform fmt check
      run: |
        cd terraform
        terraform fmt -check

    - name: Terraform init
      run: |
        cd terraform
        terraform init

    - name: Terraform validate
      run: |
        cd terraform
        terraform validate

    - name: Terraform plan
      run: |
        cd terraform
        terraform plan -var-file=terraform.tfvars -out=tfplan
        echo "Terraform plan generated successfully"

  # Kubernetes Deployment
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [frontend-build, backend-build, performance-test]
    if: github.ref == 'refs/heads/develop'
    environment: staging
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-west-2

    - name: Update Docker images
      run: |
        aws ecr get-login-password --region us-west-2 | docker login --username AWS --password-stdin 123456789012.dkr.ecr.us-west-2.amazonaws.com
        docker tag ${FRONTEND_IMAGE} ${PROD_FRONTEND_IMAGE}
        docker tag ${API_GATEWAY_IMAGE} ${PROD_API_GATEWAY_IMAGE}
        docker push ${PROD_FRONTEND_IMAGE}
        docker push ${PROD_API_GATEWAY_IMAGE}

    - name: Deploy to Kubernetes
      run: |
        kubectl config use-context staging-cluster
        kubectl apply -f enterprise-deployment/kubernetes/deployment.yaml
        kubectl rollout status deployment/esper-frontend -n esper-enterprise
        kubectl rollout status deployment/esper-api-gateway -n esper-enterprise

    - name: Run smoke tests
      run: |
        npm run test:smoke -- --env=staging

  # Production Deployment
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    if: github.event_name == 'release'
    environment: production
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-west-2

    - name: Update Docker images
      run: |
        aws ecr get-login-password --region us-west-2 | docker login --username AWS --password-stdin 123456789012.dkr.ecr.us-west-2.amazonaws.com
        docker tag ${FRONTEND_IMAGE} ${PROD_FRONTEND_IMAGE}
        docker tag ${API_GATEWAY_IMAGE} ${PROD_API_GATEWAY_IMAGE}
        docker push ${PROD_FRONTEND_IMAGE}
        docker push ${PROD_API_GATEWAY_IMAGE}

    - name: Deploy to Kubernetes
      run: |
        kubectl config use-context production-cluster
        kubectl apply -f enterprise-deployment/kubernetes/deployment.yaml
        kubectl rollout status deployment/esper-frontend -n esper-enterprise
        kubectl rollout status deployment/esper-api-gateway -n esper-enterprise

    - name: Run production smoke tests
      run: |
        npm run test:smoke -- --env=production

    - name: Run health checks
      run: |
        npm run test:health -- --env=production

  # Rollback
  rollback:
    name: Rollback Deployment
    runs-on: ubuntu-latest
    needs: [deploy-staging, deploy-production]
    if: failure()
    steps:
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-west-2

    - name: Rollback deployment
      run: |
        kubectl config use-context production-cluster
        kubectl rollout undo deployment/esper-frontend -n esper-enterprise
        kubectl rollout undo deployment/esper-api-gateway -n esper-enterprise

    - name: Verify rollback
      run: |
        kubectl rollout status deployment/esper-frontend -n esper-enterprise
        kubectl rollout status deployment/esper-api-gateway -n esper-enterprise