# Ralph Loop Configuration for ESPER Enterprise Automation

global:
  # Enterprise-wide settings
  enterprise_name: "ESPER Enterprise"
  environment: "production"
  timezone: "UTC"
  log_level: "info"
  metrics_enabled: true
  
  # Ralph Loop master orchestrator configuration
  master_interval: "30m"  # Run master orchestrator every 30 minutes
  worker_timeout: "5m"   # Timeout for individual worker tasks
  max_concurrent_workers: 10
  
  # Enterprise monitoring thresholds
  alert_thresholds:
    cpu_usage: 80
    memory_usage: 85
    disk_usage: 90
    response_time: 1000
    error_rate: 0.01
    
  # Auto-scaling triggers
  auto_scale:
    enabled: true
    min_replicas: 3
    max_replicas: 15
    scale_up_threshold: 70
    scale_down_threshold: 30
    cooldown_period: "5m"

# Master orchestrator schedules
schedules:
  # Daily health check and optimization
  daily_health_check:
    cron: "0 6 * * *"  # 6 AM UTC daily
    enabled: true
    tasks:
      - name: "system_health_check"
        type: "health_check"
        priority: "high"
        timeout: "10m"
      - name: "performance_optimization"
        type: "optimization"
        priority: "medium"
        timeout: "15m"
      - name: "security_audit"
        type: "security_scan"
        priority: "high"
        timeout: "20m"
      - name: "backup_verification"
        type: "backup_check"
        priority: "medium"
        timeout: "10m"
  
  # Hourly performance monitoring
  hourly_performance_monitor:
    cron: "0 * * * *"  # Every hour
    enabled: true
    tasks:
      - name: "performance_metrics_collection"
        type: "metrics_collection"
        priority: "medium"
        timeout: "5m"
      - name: "resource_utilization_analysis"
        type: "resource_analysis"
        priority: "medium"
        timeout: "5m"
      - name: "auto_scaling_check"
        type: "autoscaling"
        priority: "high"
        timeout: "5m"
  
  # Weekly maintenance and updates
  weekly_maintenance:
    cron: "0 2 * * 0"  # 2 AM UTC on Sunday
    enabled: true
    tasks:
      - name: "system_updates"
        type: "system_update"
        priority: "high"
        timeout: "30m"
      - name: "database_maintenance"
        type: "database_maintenance"
        priority: "high"
        timeout: "20m"
      - name: "log_rotation"
        type: "log_rotation"
        priority: "medium"
        timeout: "10m"
      - name: "certificate_renewal"
        type: "certificate_management"
        priority: "medium"
        timeout: "15m"
  
  # Monthly deep analysis and optimization
  monthly_deep_analysis:
    cron: "0 3 1 * *"  # 3 AM UTC on 1st of month
    enabled: true
    tasks:
      - name: "deep_performance_analysis"
        type: "deep_analysis"
        priority: "medium"
        timeout: "60m"
      - name: "cost_optimization"
        type: "cost_analysis"
        priority: "medium"
        timeout: "30m"
      - name: "capacity_planning"
        type: "capacity_planning"
        priority: "medium"
        timeout: "30m"
      - name: "security_compliance"
        type: "compliance_check"
        priority: "high"
        timeout: "45m"

# Worker task definitions
workers:
  # Health and monitoring workers
  health_check_worker:
    description: "Perform comprehensive system health checks"
    command: "python /app/scripts/health_check.py"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://esper:${POSTGRES_PASSWORD}@postgres:5432/esper_enterprise
      - REDIS_URL=redis://redis:6379
    retries: 3
    timeout: "10m"
    alert_on_failure: true
    
  performance_optimization_worker:
    description: "Optimize system performance based on metrics"
    command: "python /app/scripts/performance_optimizer.py"
    environment:
      - NODE_ENV=production
      - PROMETHEUS_URL=http://prometheus:9090
    retries: 2
    timeout: "15m"
    alert_on_failure: true
    
  security_scan_worker:
    description: "Run comprehensive security vulnerability scans"
    command: "python /app/scripts/security_scanner.py"
    environment:
      - SECURITY_API_KEY=${SECURITY_API_KEY}
    retries: 2
    timeout: "20m"
    alert_on_failure: true
    
  # Database workers
  database_maintenance_worker:
    description: "Perform database maintenance tasks"
    command: "python /app/scripts/database_maintenance.py"
    environment:
      - DATABASE_URL=postgresql://esper:${POSTGRES_PASSWORD}@postgres:5432/esper_enterprise
    retries: 3
    timeout: "20m"
    alert_on_failure: true
    
  # Backup and recovery workers
  backup_worker:
    description: "Create and verify system backups"
    command: "python /app/scripts/backup_manager.py"
    environment:
      - BACKUP_BUCKET=${BACKUP_BUCKET}
      - BACKUP_RETENTION_DAYS=30
    retries: 3
    timeout: "30m"
    alert_on_failure: true
    
  # Scaling workers
  auto_scaling_worker:
    description: "Auto-scale resources based on demand"
    command: "python /app/scripts/auto_scaler.py"
    environment:
      - KUBECONFIG=/app/kubeconfig
      - MIN_REPLICAS=3
      - MAX_REPLICAS=15
    retries: 2
    timeout: "5m"
    alert_on_failure: true
    
  # Analytics and optimization workers
  metrics_collection_worker:
    description: "Collect and analyze system metrics"
    command: "python /app/scripts/metrics_collector.py"
    environment:
      - PROMETHEUS_URL=http://prometheus:9090
      - GRAFANA_URL=http://grafana:3000
    retries: 2
    timeout: "5m"
    alert_on_failure: false
    
  # Compliance and auditing workers
  compliance_check_worker:
    description: "Perform compliance and security audits"
    command: "python /app/scripts/compliance_checker.py"
    environment:
      - COMPLIANCE_FRAMEWORK=ISO27001
      - AUDIT_LOG_PATH=/app/audit/logs
    retries: 2
    timeout: "45m"
    alert_on_failure: true

# Alerting configuration
alerts:
  # Critical alerts
  critical:
    - name: "System Down"
      condition: "health_check_worker_failure"
      notification:
        - email: "admin@esper-enterprise.com"
        - slack: "#alerts"
        - pagerduty: "ESPER_CRITICAL"
      escalation:
        - after: "15m"
          to: "oncall_engineer"
        - after: "30m"
          to: "engineering_manager"
    
    - name: "Security Breach"
      condition: "security_scan_worker_failure"
      notification:
        - email: "security@esper-enterprise.com"
        - slack: "#security"
        - pagerduty: "ESPER_SECURITY"
      escalation:
        - after: "5m"
          to: "security_team"
    
    - name: "Database Failure"
      condition: "database_maintenance_worker_failure"
      notification:
        - email: "dba@esper-enterprise.com"
        - slack: "#database"
        - pagerduty: "ESPER_DATABASE"
      escalation:
        - after: "10m"
          to: "dba_team"
    
  # Warning alerts
  warning:
    - name: "High CPU Usage"
      condition: "cpu_usage > 80"
      notification:
        - email: "ops@esper-enterprise.com"
        - slack: "#monitoring"
      escalation:
        - after: "30m"
          to: "oncall_engineer"
    
    - name: "Memory Usage High"
      condition: "memory_usage > 85"
      notification:
        - email: "ops@esper-enterprise.com"
        - slack: "#monitoring"
    
    - name: "Response Time Degraded"
      condition: "response_time > 1000ms"
      notification:
        - email: "devops@esper-enterprise.com"
        - slack: "#performance"

# Monitoring and observability
monitoring:
  # Metrics collection
  metrics:
    prometheus:
      enabled: true
      scrape_interval: "30s"
      retention: "30d"
      endpoints:
        - "/metrics"
        - "/health"
    
    grafana:
      enabled: true
      dashboards:
        - "system-overview"
        - "performance-metrics"
        - "security-dashboard"
        - "cost-optimization"
      alerts:
        - "high-cpu-usage"
        - "memory-pressure"
        - "error-rate-spike"
    
  # Logging
  logging:
    elasticsearch:
      enabled: true
      index_pattern: "esper-*"
      retention: "30d"
      fields:
        - timestamp
        - level
        - service
        - user_id
        - request_id
    
    loki:
      enabled: true
      retention: "7d"
      labels:
        - environment
        - service
        - severity
    
  # Tracing
  tracing:
    jaeger:
      enabled: true
      sampling_rate: 0.1
      retention: "7d"
      services:
        - "esper-frontend"
        - "esper-api-gateway"
        - "postgres"
        - "redis"

# Integration with external systems
integrations:
  # Cloud infrastructure
  aws:
    enabled: true
    services:
      - "ec2"
      - "rds"
      - "s3"
      - "cloudwatch"
      - "route53"
    notifications:
      - "sns"
      - "ses"
    
  # Security tools
  security:
    enabled: true
    tools:
      - "aws-guardduty"
      - "aws-security-hub"
      - "owasp-zap"
      - "nessus"
    sync_interval: "1h"
    
  # Business intelligence
  bi:
    enabled: true
    tools:
      - "looker"
      - "tableau"
    data_sources:
      - "esper_analytics"
      - "user_behavior"
      - "performance_metrics"
    sync_interval: "6h"

# Ralph Loop orchestration configuration
orchestration:
  # Task dependency management
  dependencies:
    health_check_worker: []
    performance_optimization_worker: ["health_check_worker"]
    security_scan_worker: ["health_check_worker"]
    database_maintenance_worker: ["health_check_worker"]
    backup_worker: ["health_check_worker"]
    auto_scaling_worker: ["performance_optimization_worker"]
    metrics_collection_worker: ["health_check_worker"]
    compliance_check_worker: ["security_scan_worker"]
  
  # Task execution order
  execution_order:
    - "health_check_worker"
    - "metrics_collection_worker"
    - "performance_optimization_worker"
    - "security_scan_worker"
    - "database_maintenance_worker"
    - "backup_worker"
    - "auto_scaling_worker"
    - "compliance_check_worker"
  
  # Task retry policies
  retry_policies:
    max_retries: 3
    retry_delay: "1m"
    exponential_backoff: true
    max_delay: "10m"
    
  # Task timeout policies
  timeout_policies:
    default: "30m"
    critical_tasks: "10m"
    long_running_tasks: "60m"
    
  # Task failure handling
  failure_handling:
    on_failure: "alert_and_retry"
    on_timeout: "alert_and_retry"
    on_max_retries: "escalate_and_manual_intervention"